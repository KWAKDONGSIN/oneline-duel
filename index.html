<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101014">
  <meta property="og:title" content="무지개 반사">
  <meta property="og:description" content="받아친 문장이 무기가 된다. AI 심판이 판정하는 턴제 텍스트 배틀.">
  <title>무지개 반사</title>
  <link rel="stylesheet" href="./css/style.css">
  <script type="importmap">{ "imports": { "three": "./libs/three.module.js" } }</script>
</head>
<body>
  <main class="app-shell">
    <section id="home" class="screen" aria-labelledby="home-title">
      <div id="account-bar" class="account-bar"></div>
      <header class="hero">
        <!-- 타이틀 일러스트: 거울로 빛을 되받아치는 그림. 문장으로 되받아친다는 게임의 컨셉을 그대로 담았다. -->
        <svg class="hero-art" viewBox="0 0 800 300" role="img" aria-label="거울로 빛을 무지개로 되받아치는 그림">
          <g class="ray">
            <path d="M330 148 L30 40 L34 66 L330 154Z" fill="#ff3b30"/>
            <path d="M330 150 L26 84 L28 108 L330 158Z" fill="#ff9500"/>
            <path d="M330 152 L24 128 L26 150 L330 162Z" fill="#ffd60a"/>
            <path d="M330 156 L26 172 L30 194 L330 166Z" fill="#34c759"/>
            <path d="M330 158 L32 214 L38 236 L330 170Z" fill="#0a84ff"/>
            <path d="M330 162 L42 254 L52 274 L330 174Z" fill="#af52de"/>
          </g>
          <path class="beam" d="M760 130 L392 150 L760 176Z"/>
          <ellipse class="mirror-glass" cx="374" cy="156" rx="60" ry="86"/>
          <ellipse class="mirror-frame" cx="374" cy="156" rx="60" ry="86"/>
          <path class="mirror-frame" d="M374 244 L374 292" stroke-linecap="round"/>
          <path class="blob" d="M470 156
            C470 74 528 20 606 20 C688 20 748 78 748 158
            C748 240 690 296 606 296 C528 296 470 240 470 156Z"/>
          <path class="face" d="M520 132 q18 -22 36 0" stroke-linecap="round"/>
          <path class="face" d="M512 196 q26 26 52 2" stroke-linecap="round"/>
          <path class="blob" d="M448 268 q26 -30 58 -8 q-24 34 -58 8Z"/>
        </svg>
        <h1 id="home-title">무지개 반사</h1>
        <p>받아친 문장이 무기가 된다</p>
      </header>
      <div id="home-content"></div>
    </section>

    <section id="ranking" class="screen" aria-labelledby="ranking-title">
      <header class="screen-header"><h2 id="ranking-title">랭킹</h2></header>
      <div id="ranking-content"></div>
    </section>

    <section id="create" class="screen" aria-labelledby="create-title">
      <header class="screen-header"><h2 id="create-title">캐릭터 만들기</h2></header>
      <div id="create-content"></div>
    </section>

    <section id="battle" class="screen battle-screen" aria-label="배틀">
      <div id="battle-content"></div>
    </section>

    <section id="result" class="screen" aria-label="결과">
      <div id="result-content"></div>
    </section>
  </main>

  <div id="difficulty-modal" class="modal" hidden></div>
  <div id="tutorial-modal" class="modal" hidden></div>
  <div id="settings-modal" class="modal" hidden></div>
  <div id="login-modal" class="modal" hidden></div>
  <div id="nickname-modal" class="modal" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script type="module">
    // 배포 직후에는 브라우저 캐시에 옛 파일과 새 파일이 섞여 모듈 로딩이 통째로
    // 실패할 수 있다. 그러면 화면은 멀쩡해 보여도 모든 버튼이 죽는다.
    // 그때는 게임 파일을 강제로 다시 받아 캐시를 갈아 끼운 뒤 한 번만 새로고침한다.
    import("./js/main.js")
      .then(() => sessionStorage.removeItem("old:self-heal"))
      .catch(async () => {
        if (sessionStorage.getItem("old:self-heal")) {
          document.querySelector("#home-content").innerHTML =
            '<p class="error panel">게임을 불러오지 못했습니다. 잠시 후 새로고침해 주세요.</p>';
          return;
        }
        sessionStorage.setItem("old:self-heal", "1");
        const files = [
          "js/main.js", "js/battle.js", "js/boss.js", "js/character.js", "js/judge.js",
          "js/storage.js", "js/render3d.js", "js/vfx.js", "js/audio.js", "js/multiplayer.js",
          "js/auth.js", "js/account.js", "js/supabase-config.js",
          "libs/three.module.js", "libs/three.core.js",
          "data/bosses.json", "data/fields.json",
        ];
        await Promise.allSettled(files.map((file) => fetch("./" + file, { cache: "reload" })));
        location.reload();
      });
  </script>
</body>
</html>
